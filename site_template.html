<script>
// one dropdown open at a time; close on outside click
document.addEventListener('click', e => document.querySelectorAll('nav details[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; }));
// size each tool frame to its content (same origin). Tools that fill the viewport (vh units) or have a
// zero-height body report scrollHeight == frame height / ~0: those keep their original aspect ratio.
document.querySelectorAll('main iframe[src^="tools/"]').forEach(f => {
  const fit = () => {
    const b = f.contentDocument && f.contentDocument.body;
    if (!b) return;
    const sh = b.scrollHeight;
    if (sh < 50 || Math.abs(sh - f.clientHeight) <= 4) return;
    const h = Math.min(sh + 16, 4000);
    if (Math.abs(f.offsetHeight - h) > 8) { f.style.aspectRatio = 'auto'; f.style.minHeight = '0'; f.style.height = h + 'px'; }
  };
  const start = () => { fit(); new ResizeObserver(fit).observe(f.contentDocument.body); };
  f.addEventListener('load', start);
  if (f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentDocument.body.childElementCount) start();
});
</script>
