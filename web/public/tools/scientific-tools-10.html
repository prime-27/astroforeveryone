<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constellations &amp; Bright Stars Explorer</title><style>body{margin:0;background:#03060b;color:#e2e8f0}</style></head><body>
<div style="width: 100%; height: 750px; position: relative; background: #03060B; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 14px; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #E6EDF3; display: flex; flex-direction: column;">
    
    <!-- Top Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(13, 17, 23, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 18px; z-index: 100;">
        <div>
            <h2 style="font-size: 1.1rem; color: #FBBF24; margin: 0; font-weight: 700;">Constellations & Bright Stars Explorer</h2>
            <p style="font-size: 0.68rem; color: #8B949E; margin: 2px 0 0 0;">Accurate Stick-Figure Geometries & Stellar Data</p>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px; color: #FBBF24; font-weight: 700;">Observatory Designer</div>
            <div style="font-size: 0.9rem; color: #FFFFFF; font-weight: 700;">Ravi Raja Pothineni</div>
        </div>
    </div>

    <!-- Main Workspace -->
    <div style="display: grid; grid-template-columns: 280px 1fr; flex: 1; overflow: hidden;">
        
        <!-- Left Panel: Constellation List -->
        <div style="background: rgba(13, 17, 23, 0.9); border-right: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;">
            <div style="font-size: 0.68rem; text-transform: uppercase; color: #79C0FF; font-weight: 700; margin-bottom: 4px;">Select Constellation</div>
            <div id="const-list" style="display: flex; flex-direction: column; gap: 3px;">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Right Panel: Visualizer & Bright Stars Info -->
        <div style="display: grid; grid-template-columns: 1fr 320px; background: #03060B; overflow: hidden;">
            <div style="position: relative; display: flex; align-items: center; justify-content: center;">
                <canvas id="const-canvas" width="600" height="600" style="width: 100%; height: 100%;"></canvas>
            </div>
            
            <div style="background: rgba(13,17,23,0.95); border-left: 1px solid rgba(255,255,255,0.1); padding: 16px; overflow-y: auto; font-size: 0.74rem;">
                <h3 id="info-title" style="font-size: 1.1rem; color: #FBBF24; margin-top: 0;">Orion</h3>
                <p id="info-meaning" style="font-size: 0.72rem; color: #38BDF8; margin-bottom: 10px;">The Hunter</p>
                
                <div style="font-size: 0.7rem; text-transform: uppercase; color: #79C0FF; font-weight: 700; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px;">Bright Stars (Yogataras)</div>
                <div id="info-stars" style="display: flex; flex-direction: column; gap: 6px;">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </div>
    </div>

    <!-- Styles -->
    <style>
        .const-btn { padding: 6px 10px; background: #161B22; border: 1px solid rgba(255,255,255,0.08); color: #C9D1D9; border-radius: 6px; font-size: 0.74rem; cursor: pointer; text-align: left; font-weight: 600; display: flex; justify-content: space-between; }
        .const-btn:hover { background: #21262D; border-color: #38BDF8; color: #38BDF8; }
        .const-btn.active { background: #0284C7; color: #FFF; border-color: #38BDF8; font-weight: 700; }
        .star-card { background: rgba(255,255,255,0.03); padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.06); }
    </style>

    <!-- Script -->
    <script>
        (function(){
            const CONSTELLATIONS = [
                {
                    id: "orion", name: "Orion", meaning: "The Hunter",
                    stars: [
                        {name: "Betelgeuse (Alpha)", mag: "0.42", type: "Red Supergiant", x: -80, y: -90},
                        {name: "Bellatrix (Gamma)", mag: "1.64", type: "Blue-white Giant", x: 80, y: -90},
                        {name: "Alnitak (Zeta)", mag: "1.77", type: "Triple Star System", x: -30, y: 0},
                        {name: "Alnilam (Epsilon)", mag: "1.69", type: "Supergiant", x: 0, y: 5},
                        {name: "Mintaka (Delta)", mag: "2.23", type: "Multiple Star System", x: 30, y: 10},
                        {name: "Saiph (Kappa)", mag: "2.07", type: "Supergiant", x: -70, y: 110},
                        {name: "Rigel (Beta)", mag: "0.13", type: "Blue Supergiant", x: 70, y: 110}
                    ],
                    lines: [[0,2], [1,4], [2,3], [3,4], [0,5], [1,6], [2,5], [4,6]]
                },
                {
                    id: "ursa_major", name: "Ursa Major", meaning: "The Great Bear (Plough / Big Dipper)",
                    stars: [
                        {name: "Dubhe (Alpha)", mag: "1.79", type: "Giant", x: -90, y: -60},
                        {name: "Merak (Beta)", mag: "2.37", type: "Subgiant", x: -90, y: 0},
                        {name: "Phecda (Gamma)", mag: "2.44", type: "Main Sequence", x: -30, y: 10},
                        {name: "Megrez (Delta)", mag: "3.31", type: "Main Sequence", x: -30, y: -40},
                        {name: "Alioth (Epsilon)", mag: "1.77", type: "Main Sequence", x: 20, y: -50},
                        {name: "Mizar (Zeta)", mag: "2.23", type: "Binary System", x: 70, y: -60},
                        {name: "Alkaid (Eta)", mag: "1.86", type: "Main Sequence", x: 120, y: -80}
                    ],
                    lines: [[0,1], [1,2], [2,3], [3,0], [3,4], [4,5], [5,6]]
                },
                {
                    id: "cassiopeia", name: "Cassiopeia", meaning: "The Vain Queen ('W' Shape)",
                    stars: [
                        {name: "Shedar (Beta)", mag: "2.28", type: "Giant", x: -100, y: 40},
                        {name: "Caph (Alpha)", mag: "2.24", type: "Subgiant", x: -50, y: -40},
                        {name: "Gamma Cas", mag: "2.15", type: "Variable Star", x: 0, y: 30},
                        {name: "Ruchbah (Delta)", mag: "2.68", type: "Subgiant", x: 50, y: -30},
                        {name: "Segin (Epsilon)", mag: "3.35", type: "Giant", x: 100, y: 50}
                    ],
                    lines: [[0,1], [1,2], [2,3], [3,4]]
                },
                {
                    id: "cygnus", name: "Cygnus", meaning: "The Swan (Northern Cross)",
                    stars: [
                        {name: "Deneb (Alpha)", mag: "1.25", type: "Supergiant", x: 0, y: -100},
                        {name: "Sadr (Gamma)", mag: "2.23", type: "Supergiant", x: 0, y: 0},
                        {name: "Albireo (Beta)", mag: "3.05", type: "Double Star", x: 0, y: 110},
                        {name: "Gienah (Epsilon)", mag: "2.48", type: "Giant", x: -70, y: -10},
                        {name: "Delta Cygni", mag: "2.87", type: "Subgiant", x: 70, y: 0}
                    ],
                    lines: [[0,1], [1,2], [3,1], [1,4]]
                },
                {
                    id: "scorpius", name: "Scorpius", meaning: "The Scorpion",
                    stars: [
                        {name: "Dschubba (Delta)", mag: "2.29", type: "Subgiant", x: -80, y: -80},
                        {name: "Antares (Alpha)", mag: "1.06", type: "Red Supergiant", x: -50, y: -20},
                        {name: "Acatrab (Beta)", mag: "2.56", type: "Subgiant", x: -80, y: -110},
                        {name: "Sargas (Theta)", mag: "1.86", type: "Bright Giant", x: 20, y: 40},
                        {name: "Shaula (Lambda)", mag: "1.62", type: "Subgiant", x: 80, y: 80}
                    ],
                    lines: [[2,0], [0,1], [1,3], [3,4]]
                }
            ];

            let activeIndex = 0;
            const listEl = document.getElementById('const-list');
            const canvas = document.getElementById('const-canvas');
            const ctx = canvas.getContext('2d');

            CONSTELLATIONS.forEach((c, i) => {
                const btn = document.createElement('button');
                btn.className = `const-btn ${i === 0 ? 'active' : ''}`;
                btn.innerHTML = `<span>${c.name}</span> <span style="color:#8B949E; font-size:0.65rem;">${c.meaning}</span>`;
                btn.onclick = () => selectConstellation(i);
                listEl.appendChild(btn);
            });

            window.selectConstellation = function(i) {
                activeIndex = i;
                document.querySelectorAll('.const-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
                const c = CONSTELLATIONS[i];
                
                document.getElementById('info-title').innerText = c.name;
                document.getElementById('info-meaning').innerText = c.meaning;

                const starsContainer = document.getElementById('info-stars');
                starsContainer.innerHTML = '';
                c.stars.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'star-card';
                    div.innerHTML = `<strong style="color:#34D399;">${s.name}</strong><br><span style="color:#8B949E;">Mag: ${s.mag} | Type: ${s.type}</span>`;
                    starsContainer.appendChild(div);
                });

                drawVisualizer(c);
            };

            function drawVisualizer(c) {
                ctx.clearRect(0, 0, 600, 600);
                const cx = 300, cy = 300;

                // Draw connecting constellation stick lines
                ctx.strokeStyle = '#38BDF8';
                ctx.lineWidth = 2;
                c.lines.forEach(line => {
                    const s1 = c.stars[line[0]];
                    const s2 = c.stars[line[1]];
                    ctx.beginPath();
                    ctx.moveTo(cx + s1.x, cy + s1.y);
                    ctx.lineTo(cx + s2.x, cy + s2.y);
                    ctx.stroke();
                });

                // Draw star nodes
                c.stars.forEach(s => {
                    ctx.beginPath();
                    ctx.arc(cx + s.x, cy + s.y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#FBBF24';
                    ctx.fill();

                    ctx.fillStyle = '#E6EDF3';
                    ctx.font = '11px sans-serif';
                    ctx.fillText(s.name.split(' ')[0], cx + s.x + 10, cy + s.y + 4);
                });
            }

            selectConstellation(0);
        })();
    </script>
</div>
</body></html>
