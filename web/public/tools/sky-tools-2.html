            const ctx = cv.getContext('2d');
            const cx = 380, cy = 380, R_CHART = 340;

            function radecToAltAz(raDeg, decDeg, lstDeg, phiDeg) {
                const H = (lstDeg - raDeg) * Math.PI / 180;
                const d = decDeg * Math.PI / 180;
                const p = phiDeg * Math.PI / 180;

                const sinAlt = Math.sin(p) * Math.sin(d) + Math.cos(p) * Math.cos(d) * Math.cos(H);
                const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
                const cosAlt = Math.cos(alt);

                let az = 0;
                if (Math.abs(cosAlt) > 1e-5 && Math.abs(Math.cos(p)) > 1e-5) {
                    const cosAz = (Math.sin(d) - Math.sin(p) * sinAlt) / (Math.cos(p) * cosAlt);
                    az = Math.acos(Math.max(-1, Math.min(1, cosAz)));
                    if (Math.sin(H) > 0) az = 2 * Math.PI - az;
                }

                return {
                    altDeg: alt * (180 / Math.PI),
                    azDeg: az * (180 / Math.PI)
                };
            }

            function altAzToCanvas(altDeg, azDeg) {
                if (isNaN(altDeg) || isNaN(azDeg) || altDeg < 0) return null;
                const r = R_CHART * ((90 - altDeg) / 90.0);
                const a = azDeg * (Math.PI / 180);
                return {
                    x: cx - r * Math.sin(a),
                    y: cy - r * Math.cos(a)
                };
            }

            function calculateEphemerisWithAstronomyEngine() {
                const yr = currentDateObj.getFullYear();
                const mo = currentDateObj.getMonth();
                const dy = currentDateObj.getDate();
                const hr = Math.floor(istHour);
                const mn = Math.floor((istHour - hr) * 60);

                const istMillis = Date.UTC(yr, mo, dy, hr, mn, 0);
                const utcDate = new Date(istMillis - (5.5 * 60 * 60 * 1000));

                const observer = new Astronomy.Observer(observerLat, observerLon, 0);
                const astTime = Astronomy.MakeTime(utcDate);
                const lstDeg = Astronomy.SiderealTime(astTime) * 15.0 + observerLon;
                let LST = (lstDeg % 360 + 360) % 360;

                const moonEquator = Astronomy.Equator(Astronomy.Body.Moon, astTime, observer, true, true);
                const moonIllum = Astronomy.Illumination(Astronomy.Body.Moon, astTime);
                const moonIllumPct = moonIllum.phase_fraction * 100;

                const planetBodies = [
                    { id: "Mercury", body: Astronomy.Body.Mercury, symbol: "☿", col: "#A5A5A5" },
                    { id: "Venus", body: Astronomy.Body.Venus, symbol: "♀", col: "#E3BB7B" },
                    { id: "Mars", body: Astronomy.Body.Mars, symbol: "♂", col: "#EF4444" },
                    { id: "Jupiter", body: Astronomy.Body.Jupiter, symbol: "♃", col: "#F59E0B" },
                    { id: "Saturn", body: Astronomy.Body.Saturn, symbol: "♄", col: "#FDE68A" }
                ];

                const planetSky = planetBodies.map(pl => {
                    const eq = Astronomy.Equator(pl.body, astTime, observer, true, true);
                    return { id: pl.id, symbol: pl.symbol, col: pl.col, ra: eq.ra * 15.0, dec: eq.dec };
                });

                return {
                    LST,
                    moonRA: moonEquator.ra * 15.0,
                    moonDec: moonEquator.dec,
                    moonIllum: moonIllumPct,
                    planetSky
                };
            }

            function renderPlanisphere() {
                try {
                    ctx.clearRect(0, 0, 760, 760);
                    const eph = calculateEphemerisWithAstronomyEngine();

                    const isNight = currentTheme === 'night';
                    const colBg = isNight ? '#030712' : '#FFFFFF';
                    const colBorder = isNight ? '#38BDF8' : '#0F172A';
                    const colGrid = isNight ? 'rgba(56, 189, 248, 0.15)' : 'rgba(0, 0, 0, 0.12)';
                    const colStars = isNight ? '#FFFFFF' : '#0F172A';
                    const colLines = isNight ? 'rgba(147, 197, 253, 0.45)' : 'rgba(30, 41, 59, 0.65)';
                    const colText = isNight ? '#94A3B8' : '#334155';

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(cx, cy, R_CHART, 0, Math.PI * 2);
                    ctx.fillStyle = colBg;
                    ctx.fill();
                    ctx.clip();

                    if (document.getElementById('chk-altaz-grid').checked) {
                        ctx.strokeStyle = colGrid;
                        ctx.lineWidth = 1;
                        [30, 60, 75].forEach(alt => {
                            ctx.beginPath();
                            ctx.arc(cx, cy, R_CHART * ((90 - alt) / 90.0), 0, Math.PI * 2);
                            ctx.stroke();
                        });
                        ctx.beginPath();
                        ctx.moveTo(cx, cy - R_CHART); ctx.lineTo(cx, cy + R_CHART);
                        ctx.moveTo(cx - R_CHART, cy); ctx.lineTo(cx + R_CHART, cy);
                        ctx.stroke();
                    }

                    if (document.getElementById('chk-ecliptic').checked) {
                        ctx.strokeStyle = isNight ? 'rgba(0, 229, 255, 0.4)' : 'rgba(2, 132, 199, 0.4)';
                        ctx.lineWidth = 1.2;
                        let drawing = false;
                        ctx.beginPath();
                        for (let i = 0; i <= 90; i++) {
                            const hor = radecToAltAz((i / 90) * 360, 0, eph.LST, observerLat);
                            const p = altAzToCanvas(hor.altDeg, hor.azDeg);
                            if (p) {
                                if (!drawing) { ctx.moveTo(p.x, p.y); drawing = true; }
                                else { ctx.lineTo(p.x, p.y); }
                            } else {
                                drawing = false;
                            }
                        }
                        ctx.stroke();
                    }

                    if (document.getElementById('chk-constellations').checked) {
                        CONSTELLATIONS.forEach(c => {
                            const mappedStars = c.stars.map(s => {
                                const hor = radecToAltAz(s.ra, s.dec, eph.LST, observerLat);
                                return altAzToCanvas(hor.altDeg, hor.azDeg);
                            });

                            ctx.strokeStyle = colLines;
                            ctx.lineWidth = 1.2;
                            c.lines.forEach(pair => {
                                const p1 = mappedStars[pair[0]];
                                const p2 = mappedStars[pair[1]];
                                if (p1 && p2) {
                                    ctx.beginPath();
                                    ctx.moveTo(p1.x, p1.y);
                                    ctx.lineTo(p2.x, p2.y);
                                    ctx.stroke();
                                }
                            });

                            if (document.getElementById('chk-const-labels').checked) {
                                const lHor = radecToAltAz(c.labelRa, c.labelDec, eph.LST, observerLat);
                                const lp = altAzToCanvas(lHor.altDeg, lHor.azDeg);
                                if (lp) {
                                    ctx.fillStyle = isNight ? '#FBBF24' : '#B45309';
                                    ctx.font = 'bold 9px sans-serif';
                                    ctx.textAlign = 'center';
                                    ctx.fillText(c.name, lp.x, lp.y);
                                }
                            }
                        });
                    }

                    if (document.getElementById('chk-dsos').checked) {
                        DEEP_SKY_OBJECTS.forEach(dso => {
                            const hor = radecToAltAz(dso.ra, dso.dec, eph.LST, observerLat);
                            const p = altAzToCanvas(hor.altDeg, hor.azDeg);
                            if (p) {
                                ctx.strokeStyle = isNight ? '#C084FC' : '#7E22CE';
                                ctx.lineWidth = 1.5;
                                ctx.strokeRect(p.x - 3, p.y - 3, 6, 6);
                                ctx.fillStyle = isNight ? '#D8B4FE' : '#6B21A8';
                                ctx.font = '9px sans-serif';
                                ctx.textAlign = 'left';
                                ctx.fillText(dso.name, p.x + 5, p.y + 3);
                            }
                        });
                    }

                    if (document.getElementById('chk-stars').checked) {
                        BRIGHT_STARS.forEach(s => {
                            const hor = radecToAltAz(s.ra, s.dec, eph.LST, observerLat);
                            const p = altAzToCanvas(hor.altDeg, hor.azDeg);
                            if (p) {
                                const r = Math.max(1.8, 4.2 - (s.mag + 1.5) * 0.8);
                                ctx.beginPath();
                                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                                ctx.fillStyle = isNight ? s.col : colStars;
                                ctx.fill();

                                if (s.mag < 1.1) {
                                    ctx.fillStyle = colText;
                                    ctx.font = '9px sans-serif';
                                    ctx.textAlign = 'left';
                                    ctx.fillText(s.name, p.x + 4, p.y - 2);
                                }
                            }
                        });
                    }

                    let visiblePlanetsCount = 0;
                    let moonVisible = false;
                    if (document.getElementById('chk-planets').checked) {
                        eph.planetSky.forEach(pl => {
                            const hor = radecToAltAz(pl.ra, pl.dec, eph.LST, observerLat);
                            const p = altAzToCanvas(hor.altDeg, hor.azDeg);
                            if (p) {
                                visiblePlanetsCount++;
                                ctx.beginPath();
                                ctx.arc(p.x, p.y, 5.5, 0, Math.PI * 2);
                                ctx.fillStyle = isNight ? pl.col : '#B45309';
                                ctx.fill();
                                ctx.strokeStyle = '#FFFFFF';
                                ctx.lineWidth = 1.5;
                                ctx.stroke();

                                ctx.fillStyle = isNight ? '#FFFFFF' : '#000000';
                                ctx.font = 'bold 10.5px sans-serif';
                                ctx.textAlign = 'left';
                                ctx.fillText(`${pl.symbol} ${pl.id}`, p.x + 7, p.y + 4);
                            }
                        });

                        const mHor = radecToAltAz(eph.moonRA, eph.moonDec, eph.LST, observerLat);
                        const mp = altAzToCanvas(mHor.altDeg, mHor.azDeg);
                        if (mp) {
                            moonVisible = true;
                            ctx.beginPath();
                            ctx.arc(mp.x, mp.y, 7.0, 0, Math.PI * 2);
                            ctx.fillStyle = isNight ? '#FDE047' : '#D97706';
                            ctx.fill();
                            ctx.strokeStyle = '#FFFFFF';
                            ctx.lineWidth = 1.5;
                            ctx.stroke();

                            ctx.fillStyle = isNight ? '#FBBF24' : '#78350F';
                            ctx.font = 'bold 11px sans-serif';
                            ctx.textAlign = 'left';
                            ctx.fillText(`Moon (${eph.moonIllum.toFixed(0)}% Illum)`, mp.x + 10, mp.y + 4);
                        }
                    }

                    ctx.restore();

                    ctx.beginPath();
                    ctx.arc(cx, cy, R_CHART, 0, Math.PI * 2);
                    ctx.strokeStyle = colBorder;
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    const cardinals = [
                        { name: "N (North)", x: cx, y: cy - R_CHART - 10, align: 'center' },
                        { name: "E (East)", x: cx - R_CHART - 10, y: cy + 4, align: 'right' },
                        { name: "S (South)", x: cx, y: cy + R_CHART + 16, align: 'center' },
                        { name: "W (West)", x: cx + R_CHART + 10, y: cy + 4, align: 'left' }
                    ];

                    ctx.font = 'bold 12px sans-serif';
                    ctx.fillStyle = isNight ? '#38BDF8' : '#0F172A';
                    cardinals.forEach(c => {
                        ctx.textAlign = c.align;
                        ctx.fillText(c.name, c.x, c.y);
                    });

                    const dateStr = currentDateObj.toISOString().slice(0, 10);
                    const h = Math.floor(istHour);
                    const m = Math.floor((istHour - h) * 60);
                    document.getElementById('chart-summary').innerHTML = `
                        <strong>Location:</strong> ${locationLabel} | 
                        <strong>Date & Time:</strong> ${dateStr} @ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} IST | 
                        <strong>Moon:</strong> RA ${(eph.moonRA/15).toFixed(1)}h, ${eph.moonIllum.toFixed(1)}% Illum (${moonVisible ? 'Above Horizon' : 'Set Below Horizon'}) | 
                        <strong>Planets:</strong> ${visiblePlanetsCount} Visible | 
                        <strong>Designer:</strong> Ravi Raja Pothineni
                    `;
                } catch (err) {
                    console.error(err);
                }
            }

            window.triggerPrintEmbed = function() {
                setTheme('print');
                setTimeout(() => {
                    const canvasDataURL = cv.toDataURL('image/png');
                    const summaryHTML = document.getElementById('chart-summary').innerHTML;
                    
                    const printWin = window.open('', '_blank');
                    if (!printWin) {
                        alert("Please allow popups to open the printable planisphere document.");
                        return;
                    }
                    
                    printWin.document.write(`
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>Planisphere - Ravi Raja Pothineni, Professional Astronomer</title>
                            <style>
                                body { font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; margin: 20px; background: #FFF; color: #000; }
                                .header { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px; }
                                h1 { font-size: 20px; text-transform: uppercase; margin: 0 0 4px 0; }

                                .telemetry { font-family: monospace; font-size: 12px; border: 1px solid #000; padding: 10px; border-radius: 6px; text-align: left; max-width: 660px; margin: 0 auto; }
                            </style>
                        </head>
                        <body>
                            <div class="header">
                                <h1>Topocentric Planisphere & Star Chart</h1>
                                <div class="author">Ravi Raja Pothineni, Professional Astronomer</div>
                            </div>
                            <img src=_%24%7bcanvasDataURL%7d_.html alt="Star Chart Planisphere">
                            <div class="telemetry">${summaryHTML}</div>
                            <script>
                                window.onload = function() { window.print(); };
                            <\/script>
                        </body>
                        </html>
                    `);
                    printWin.document.close();
                }, 300);
            };

            window.triggerSaveImage = function() {
                const link = document.createElement('a');
                const dateStr = currentDateObj.toISOString().slice(0, 10);
                link.download = `Star_Chart_${locationLabel.split(' ')[0]}_${dateStr}.png`;
                link.href = cv.toDataURL('image/png');
                link.click();
            };

            window.setPresetLocation = function(lat, lon, label, btn) {
                observerLat = lat; observerLon = lon; locationLabel = label;
                document.querySelectorAll('.btn-loc').forEach(b => b.classList.remove('active'));
                if (btn) btn.classList.add('active');

                document.getElementById('rng-lat').value = lat;
                document.getElementById('txt-lat').innerText = `${lat.toFixed(2)}° ${lat >= 0 ? 'N' : 'S'}`;
                renderPlanisphere();
            };

            window.setTheme = function(theme) {
                currentTheme = theme;
                document.getElementById('btn-theme-night').classList.toggle('active', theme === 'night');
                document.getElementById('btn-theme-print').classList.toggle('active', theme === 'print');
                renderPlanisphere();
            };

            document.getElementById('rng-lat').oninput = (e) => {
                observerLat = parseFloat(e.target.value);
                locationLabel = `Custom Location (${observerLat.toFixed(2)}° N)`;
                document.getElementById('txt-lat').innerText = `${observerLat.toFixed(2)}° ${observerLat >= 0 ? 'N' : 'S'}`;
                document.querySelectorAll('.btn-loc').forEach(b => b.classList.remove('active'));
                renderPlanisphere();
            };

            document.getElementById('rng-hour').oninput = (e) => {
                istHour = parseFloat(e.target.value);
                const h = Math.floor(istHour);
                const m = Math.floor((istHour - h) * 60);
                document.getElementById('txt-hour').innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')} IST`;
                renderPlanisphere();
            };

            const datePicker = document.getElementById('picker-observation-date');
            datePicker.oninput = (e) => {
                const val = e.target.value;
                if (val) {
                    const parts = val.split('-');
                    currentDateObj = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]), 12, 0, 0);
                    document.getElementById('txt-date-display').innerText = val;
                    renderPlanisphere();
                }
            };

            ['chk-planets', 'chk-stars', 'chk-constellations', 'chk-const-labels', 'chk-dsos', 'chk-ecliptic', 'chk-altaz-grid'].forEach(id => {
                document.getElementById(id).onchange = renderPlanisphere;
            });

            renderPlanisphere();
        })();
    </script>
