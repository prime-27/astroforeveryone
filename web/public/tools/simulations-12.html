<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Solar Nebula 3D Studio - Interactive Menu</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020205;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #fff;
            background: rgba(5, 5, 15, 0.8);
            backdrop-filter: blur(10px);
            padding: 22px;
            border-radius: 16px;
            width: 320px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        h1 {
            margin: 0 0 8px 0;
            color: #00f3ff;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .phase-tag {
            color: #ffaa00;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        p {
            font-size: 12px;
            line-height: 1.6;
            color: #a5b4fc;
            margin: 0 0 12px 0;
        }
        .data-readout {
            font-family: monospace;
            font-size: 11px;
            color: #38bdf8;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }
        /* Toolbar Menu */
        #toolbar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 5, 15, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            border: none;
            color: #fff;
            padding: 7px 14px;
            font-weight: 600;
            font-size: 11px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0,243,255,0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0,243,255,0.8);
        }
        .btn.active {
            background: linear-gradient(135deg, #ffaa00, #ff4500);
            box-shadow: 0 0 15px rgba(255,170,0,0.6);
        }
        .divider {
            width: 1px;
            height: 25px;
            background: rgba(255,255,255,0.2);
        }
        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 11px;
        }
        input[type=range] {
            accent-color: #00f3ff;
            cursor: pointer;
            width: 80px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <h1>Solar Nebula Studio</h1>
        <div class="phase-tag" id="phase-title">Select Stage Option</div>
        <p id="phase-desc">Choose a step from the bottom menu to simulate specific phases of solar system formation instantly.</p>
        <div class="data-readout" id="readout">
            Simulation Time: 0.00 Million Years<br>
            Core Fusion Temp: 1,500 K<br>
            Active Mode: Manual Select
        </div>
    </div>

    <div id="toolbar">
        <button class="btn active" onclick="setStage(1)">1. Cloud Collapse</button>
        <button class="btn" onclick="setStage(2)">2. Disk Flattening</button>
        <button class="btn" onclick="setStage(3)">3. Accretion & Protoplanets</button>
        <div class="divider"></div>
        <button class="btn" id="toggleBtn" style="background:#334155;">Pause</button>
        <button class="btn" style="background: linear-gradient(135deg, #f43f5e, #fb923c);" onclick="triggerPulse()">Thermal Pulse</button>
        <div class="slider-wrap">
            <span>Speed:</span>
            <input type="range" id="speedRange" min="0.5" max="8" step="0.5" value="2">
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 60, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.04;

        // Background Starfield
        const starGeo = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPos = new Float32Array(starCount * 3);
        for(let i = 0; i < starCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 1000;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.6, transparent: true, opacity: 0.7})));

        // Proto-Sun Core
        const sunGroup = new THREE.Group();
        scene.add(sunGroup);
        sunGroup.add(new THREE.Mesh(new THREE.SphereGeometry(5, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffedd5 })));
        
        const coronaMesh = new THREE.Mesh(
            new THREE.SphereGeometry(7.5, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending })
        );
        sunGroup.add(coronaMesh);
        sunGroup.add(new THREE.Mesh(new THREE.SphereGeometry(12, 32, 32), new THREE.MeshBasicMaterial({ color: 0xff2200, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending })));

        // Nebula Particle System
        const particleCount = 4000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const particleData = [];

        const colorInside = new THREE.Color(0xffaa00);
        const colorMid = new THREE.Color(0x00f3ff);
        const colorOutside = new THREE.Color(0x7c3aed);

        for (let i = 0; i < particleCount; i++) {
            const radius = 12 + Math.random() * 140;
            const angle = Math.random() * Math.PI * 2;
            const height = (Math.random() - 0.5) * 25;

            positions[i * 3] = Math.cos(angle) * radius;
            positions[i * 3 + 1] = height;
            positions[i * 3 + 2] = Math.sin(angle) * radius;

            let mixedColor = colorInside.clone();
            if (radius > 50) {
                mixedColor.lerp(colorMid, (radius - 50) / 60);
            } else {
                mixedColor.lerp(colorOutside, radius / 140);
            }

            colors[i * 3] = mixedColor.r;
            colors[i * 3 + 1] = mixedColor.g;
            colors[i * 3 + 2] = mixedColor.b;

            particleData.push({
                radius: radius,
                angle: angle,
                speed: Math.sqrt(200 / radius) * 0.02,
                initialHeight: height
            });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const nebulaSystem = new THREE.Points(geometry, new THREE.PointsMaterial({
            size: 1.8, vertexColors: true, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false
        }));
        scene.add(nebulaSystem);

        // Simulation State Controls
        let currentStage = 1;
        let isRunning = true;
        let time = 0;
        let thermalPulse = 0;

        window.setStage = function(stage) {
            currentStage = stage;
            
            // Update button highlights
            const buttons = document.querySelectorAll('#toolbar .btn');
            buttons.forEach((b, idx) => {
                if (idx < 3) {
                    b.classList.toggle('active', idx + 1 === stage);
                }
            });

            // Adjust parameters based on chosen stage
            if (stage === 1) {
                time = 0.5;
                phaseTitle.innerText = "Stage I: Molecular Cloud Collapse";
                phaseDesc.innerText = "A vast interstellar gas cloud contracts under self-gravity, initiating inward motion.";
            } else if (stage === 2) {
                time = 5.0;
                phaseTitle.innerText = "Stage II: Circumstellar Disk Flattening";
                phaseDesc.innerText = "Conservation of angular momentum forces the particle cloud into a rapidly spinning flattened plane.";
            } else if (stage === 3) {
                time = 12.0;
                phaseTitle.innerText = "Stage III: Accretion & Protoplanets";
                phaseDesc.innerText = "Material collects into clear rings and planetesimals while nuclear fusion activates in the core.";
            }
        };

        window.triggerPulse = function() {
            thermalPulse = 3.0;
        };

        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            toggleBtn.innerText = isRunning ? "Pause" : "Resume";
            toggleBtn.style.background = isRunning ? "#334155" : "#0284c7";
        });

        const speedRange = document.getElementById('speedRange');
        const phaseTitle = document.getElementById('phase-title');
        const phaseDesc = document.getElementById('phase-desc');
        const readout = document.getElementById('readout');

        // Initialize default stage text
        setStage(1);

        function animate() {
            requestAnimationFrame(animate);

            const dt = 0.016 * parseFloat(speedRange.value);

            if (isRunning) {
                time += dt * 0.5;

                readout.innerHTML = `
                    Simulation Time: ${time.toFixed(2)} Million Years<br>
                    Core Fusion Temp: ${(1500 + time * 400).toFixed(0)} K<br>
                    Active Stage: Option ${currentStage}
                `;

                if (thermalPulse > 0) thermalPulse -= dt * 1.5;

                const posArr = nebulaSystem.geometry.attributes.position.array;
                
                for (let i = 0; i < particleCount; i++) {
                    let p = particleData[i];
                    p.angle += p.speed * parseFloat(speedRange.value);

                    // Behavior changes depending on active selected menu option
                    let targetHeight = 0;
                    let targetRadius = p.radius;

                    if (currentStage === 1) {
                        // Diffuse cloud phase (spread out, tall volume)
                        targetHeight = p.initialHeight;
                    } else if (currentStage === 2) {
                        // Flattening disk phase
                        targetHeight = p.initialHeight * 0.3;
                        if (p.radius > 15) p.radius -= 0.01 * parseFloat(speedRange.value);
                    } else if (currentStage === 3) {
                        // Advanced accretion phase (tightly flat, ring separation)
                        targetHeight = p.initialHeight * 0.05;
                        if (p.radius > 8) p.radius -= 0.02 * parseFloat(speedRange.value);
                    }

                    let burstOffset = Math.sin(time * 6 - p.radius * 0.1) * thermalPulse * 4;

                    posArr[i * 3] = Math.cos(p.angle) * (targetRadius + burstOffset);
                    posArr[i * 3 + 1] = targetHeight;
                    posArr[i * 3 + 2] = Math.sin(p.angle) * (targetRadius + burstOffset);
                }
                nebulaSystem.geometry.attributes.position.needsUpdate = true;

                const pulse = 1 + Math.sin(time * 6) * 0.05 + thermalPulse * 0.25;
                coronaMesh.scale.set(pulse, pulse, pulse);
            }

            scene.rotation.y += 0.002 * parseFloat(speedRange.value);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
